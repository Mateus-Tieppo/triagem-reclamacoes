[project]
name = "triagem-reclamacoes"
version = "0.1.0"
description = "Triagem de reclamações de e-commerce em português com LLMs locais (Ollama) e TF-IDF + SVM"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
